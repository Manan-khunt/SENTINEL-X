# SENTINEL-X development environment (SQLite only — no Redis/Kafka/Postgres).
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:///./sentinelx.db
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - sentinelx-data:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sentinelx-data:
